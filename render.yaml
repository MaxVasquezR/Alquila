services:
  - type: web
    name: alquila-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: alquila-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: https://alquila-1.onrender.com
      - key: APP_URL
        value: https://alquila-1.onrender.com
      - key: API_BASE_URL
        value: https://alquila.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: KYC_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"

databases:
  - name: alquila-postgres
    plan: starter
